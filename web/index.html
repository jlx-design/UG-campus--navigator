<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>UG Campus Navigator</title>
  <meta name="description" content="Campus map, walking directions, fresher guide and assistant for the University of Ghana, Legon." />
  <meta name="theme-color" content="#0b2a5b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <!-- Apply the saved theme before first paint to avoid a flash of the wrong theme. -->
  <script>
    (function () { try { var t = localStorage.getItem('ugnav.theme') || 'system';
      var d = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = d ? 'dark' : 'light'; } catch (e) {} })();
  </script>
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <noscript>UG Campus Navigator needs JavaScript to show the map.</noscript>
  <div id="root"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
